# The tests: every pull request, whatever it touches, runs the test suite,
# `pyrtan check` and the trees' own tests on its own code, so a change to
# the runtime is tested as surely as a change to a tree (and "catalog /
# tests" can be a required check without leaving any pull request waiting
# on it). The gate, which decides whether the pull request may change what
# it changes, runs from main in the catalog-gate workflow, so a pull
# request cannot change the gate that judges it.

name: catalog

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --extra identity   # the identity tests sign and verify
      - run: uv run pytest -q
      - run: uv run pyrtan check examples catalog --quiet
      - run: uv run pyrtan test examples catalog   # each tree's own [[tests]], against their recordings
