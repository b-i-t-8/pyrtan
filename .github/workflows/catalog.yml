# The catalog tests: every pull request that touches a tree, a name or the
# gate runs the test suite and `pyrtan check` on its own code. The gate
# itself, which decides whether the pull request may change what it
# changes, runs from main in the catalog-gate workflow, so a pull request
# cannot change the gate that judges it.

name: catalog

on:
  pull_request:
    paths:
      - "catalog/**"
      - "examples/**"
      - "site/gate.py"
      - "src/pyrtan/catalog.py"
      - "site/names/**"
      - "src/pyrtan/names.py"
      - "src/pyrtan/identity.py"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra identity   # the identity tests sign and verify
      - run: uv run pytest -q
      - run: uv run pyrtan check examples catalog --quiet
