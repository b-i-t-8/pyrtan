# pyrtan.com: this repository's GitHub Pages site. On every push to main
# and once an hour, build the landing page, the console (from this
# checkout's pyrtan), the catalog (from examples/ and catalog/, through the
# gate), the seed list and a snapshot of the directory and of the gap
# reports as the seeds know them, and publish them. Set the
# repository's Pages source to "GitHub Actions" and its custom domain to
# pyrtan.com; site/CNAME carries the domain.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"   # hourly: refresh rendezvous/directory.json from the seeds

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run site/build.sh out
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
