# pyrtan.com: this repository's GitHub Pages site. On every push to main,
# build the landing page, the console (from this checkout's pyrtan), the
# catalog (from examples/) and the seed list, and publish them. Set the
# repository's Pages source to "GitHub Actions" and its custom domain to
# pyrtan.com; site/CNAME carries the domain.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run site/build.sh out
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
