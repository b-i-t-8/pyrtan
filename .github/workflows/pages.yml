# pyrtan.com: this repository's GitHub Pages site. On every push to main
# and once an hour, build the landing page, the console (from this
# checkout's pyrtan), the source browser (files, releases, branches and
# history from git), the catalog (from examples/ and catalog/, through the
# gate), the hub list and a snapshot of the directory and of the gap
# reports as the hubs on it, and every hub they know of, know them, and
# publish them. pyrtan.com runs no hub: these static files are all of it. Set the
# repository's Pages source to "GitHub Actions" and its custom domain to
# pyrtan.com; site/CNAME carries the domain.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"   # hourly: refresh rendezvous/directory.json from the hub list

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # every branch and the whole history, for /source
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --extra identity   # the identity tests sign and verify
      - run: uv run pytest -q
      - run: uv run site/build.sh out
      # v3, not v4: v4 leaves out dot-directories, and the names are served
      # from .well-known/pyrtan/.
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4