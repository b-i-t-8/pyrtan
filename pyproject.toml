[project]
name = "pyrtan"
version = "0.24.1"
description = "Open-source total automation: a core set of expandable services that act on all forms of I/O through inspectable decision trees."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
keywords = ["automation", "decision-tree", "swarm", "agents", "web"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Repository = "https://github.com/b-i-t-8/pyrtan"

[project.scripts]
pyrtan = "pyrtan.cli:main"

[project.optional-dependencies]
browser = ["playwright>=1.45"]
identity = ["cryptography>=42"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrtan"]

# The default trees ship inside the package, so every console carries them
# (pyrtan/defaults.py finds them here, or in a checkout at the root).
[tool.hatch.build.targets.wheel.force-include]
"examples" = "pyrtan/trees/examples"
"catalog" = "pyrtan/trees/catalog"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
