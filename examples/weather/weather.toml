# Weather for a place, from Open-Meteo (no key needed). Two hops: geocode
# the name, then fetch the forecast for the coordinates. Each hop has its
# own decision so a failure says which hop failed.

name = "weather"
version = 4
namespace = "pyrtan"
description = "Current weather for a place, from Open-Meteo."
tags = ["weather", "read-only"]
license = "MIT"
hosts = ["geocoding-api.open-meteo.com", "api.open-meteo.com"]
start = "geocode"

# "forecast in Oslo" and "temperature in Oslo" read as "weather in Oslo".
[language]
synonyms = { weather = ["forecast", "temperature"] }

[[triggers]]
pattern = "[what's the] weather in {place}"
[[triggers]]
pattern = "[what's the] weather for {place}"
[[triggers]]
pattern = "how [hot|cold|warm] is it in {place}"

[inputs.place]
type = "str"
description = "A town or city name"

[inputs.units]
type = "str"
default = "celsius"
one_of = ["celsius", "fahrenheit"]

# The tree's own tests: pyrtan test runs them against the recording
# beside this file (pyrtan run --record writes one), and pyrtan diff runs
# them before and after an edit, to say which answers the edit changed.
[[tests]]
name = "rain in Oslo"
sentence = "weather in Oslo"
fixture = "weather.fixture.json"
expect = { status = "done", path = ["geocode", "found", "forecast", "have-temp", "sky", "reply"], say = "Oslo, Norway: 4.2°C, raining, humidity 80%, wind 12.3 km/h.", output = { sky = "raining", unit = "°C" } }

[[tests]]
name = "clear, in fahrenheit"
inputs = { place = "Oslo", units = "fahrenheit" }
fixture = "weather.fixture.json"
expect = { status = "done", output = { temperature = 39.6, unit = "°F", sky = "clear" } }

[[tests]]
name = "a place that is not there"
sentence = "how cold is it in Nowhereville"
fixture = "weather.fixture.json"
expect = { status = "failed", reason = "unknown-place", path = ["geocode", "found", "unknown-place"] }

[nodes.geocode]
kind = "observe"
http = { method = "GET", url = "https://geocoding-api.open-meteo.com/v1/search?name={{ inputs.place | url }}&count=1&language=en&format=json" }
into = "geo"
extract = [
  { into = "hit", json = "json.results[0]" },
  { into = "lat", json = "json.results[0].latitude" },
  { into = "lon", json = "json.results[0].longitude" },
  { into = "name", json = "json.results[0].name" },
  { into = "country", json = "json.results[0].country" },
]
next = "found"

[nodes.found]
kind = "decide"
on = "hit"
branches = [
  { when = { exists = true }, then = "forecast" },
  { else = "unknown-place" },
]

[nodes.forecast]
kind = "observe"
http = { method = "GET", url = "https://api.open-meteo.com/v1/forecast?latitude={{ state.lat }}&longitude={{ state.lon }}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&temperature_unit={{ inputs.units }}" }
into = "fc"
extract = [
  { into = "temp", json = "json.current.temperature_2m" },
  { into = "humidity", json = "json.current.relative_humidity_2m" },
  { into = "wind", json = "json.current.wind_speed_10m" },
  { into = "code", json = "json.current.weather_code" },
  { into = "unit", json = "json.current_units.temperature_2m" },
]
next = "have-temp"

[nodes.have-temp]
kind = "decide"
on = "temp"
branches = [
  { when = { type = "number" }, then = "sky" },
  { else = "no-forecast" },
]

# WMO weather codes, folded into words a person would use.
[nodes.sky]
kind = "lookup"
on = "code"
into = "sky"
table = [
  { eq = 0, value = "clear" },
  { between = [1, 3], value = "cloudy" },
  { between = [45, 48], value = "foggy" },
  { between = [51, 67], value = "raining" },
  { between = [71, 77], value = "snowing" },
  { between = [80, 82], value = "raining" },
  { between = [85, 86], value = "snowing" },
  { between = [95, 99], value = "stormy" },
]
default = "weather code {{ state.code }}"
next = "reply"

[nodes.reply]
kind = "done"
say = "{{ state.name }}, {{ state.country }}: {{ state.temp }}{{ state.unit }}, {{ state.sky }}, humidity {{ state.humidity }}%, wind {{ state.wind }} km/h."
output = { place = "{{ state.name }}", country = "{{ state.country }}", temperature = "{{ state.temp }}", unit = "{{ state.unit }}", sky = "{{ state.sky }}", humidity = "{{ state.humidity }}", wind_kmh = "{{ state.wind }}" }

[nodes.unknown-place]
kind = "fail"
reason = "unknown-place"
say = "I could not find a place called {{ inputs.place }}."

[nodes.no-forecast]
kind = "fail"
reason = "no-forecast"
say = "Open-Meteo found {{ state.name }} but returned no current temperature (status {{ state.fc.status }})."
