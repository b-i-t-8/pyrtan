# The spot price of a cryptocurrency, from Coinbase's public price API.
# The common coins answer to their names; any other by its ticker.

name = "crypto-price"
version = 1
namespace = "pyrtan"
description = "The spot price of a cryptocurrency in a currency, from Coinbase."
tags = ["money", "crypto", "read-only"]
license = "MIT"
hosts = ["api.coinbase.com"]
start = "fetch"

[[triggers]]
pattern = "[what's the] (bitcoin|btc) price [in {currency:word}]"
inputs = { coin = "BTC" }
[[triggers]]
pattern = "[what's the] (ethereum|eth) price [in {currency:word}]"
inputs = { coin = "ETH" }
[[triggers]]
pattern = "[what's the] (solana|sol) price [in {currency:word}]"
inputs = { coin = "SOL" }
[[triggers]]
pattern = "[what's the] (crypto|coin) price of {coin:word} [in {currency:word}]"

[inputs.coin]
type = "str"
pattern = "^[A-Za-z0-9]{2,10}$"
description = "A ticker, as in: BTC"

[inputs.currency]
type = "str"
default = "USD"
pattern = "^[A-Za-z]{3}$"
description = "A three-letter currency code, as in: USD"

[nodes.fetch]
kind = "observe"
http = { method = "GET", url = "https://api.coinbase.com/v2/prices/{{ inputs.coin | upper }}-{{ inputs.currency | upper }}/spot" }
into = "resp"
extract = [
  { into = "amount", json = "json.data.amount" },
  { into = "base", json = "json.data.base" },
  { into = "in", json = "json.data.currency" },
]
next = "status"

[nodes.status]
kind = "decide"
on = "resp.status"
branches = [
  { when = { eq = 200 }, then = "reply" },
  { when = { in = [400, 404] }, then = "unknown-pair" },
  { else = "unexpected" },
]

[nodes.reply]
kind = "done"
say = "1 {{ state.base }} is {{ state.amount }} {{ state.in }} (Coinbase spot price)."
output = { coin = "{{ state.base }}", currency = "{{ state.in }}", price = "{{ state.amount | float }}" }

[nodes.unknown-pair]
kind = "fail"
reason = "unknown-pair"
say = "Coinbase has no price for {{ inputs.coin | upper }} in {{ inputs.currency | upper }}."

[nodes.unexpected]
kind = "fail"
reason = "unexpected-status"
say = "Coinbase answered {{ state.resp.status }}."
