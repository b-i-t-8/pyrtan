# Whether a smart plug is on, from a Matter controller. Matter devices
# live on a fabric (commissioning, certificates, secure sessions) that a
# controller holds, so a matter node talks to python-matter-server over
# its WebSocket and the controller talks to the plug. A path is
# endpoint/cluster/attribute, by name or number; a lookup turns the plug's
# name into the node id the controller gave it.

name = "plug-status"
version = 1
namespace = "pyrtan"
description = "Whether a smart plug is on, from a Matter controller."
tags = ["home", "matter", "read-only"]
license = "MIT"
hosts = ["matter.local"]
start = "which"

[[triggers]]
pattern = "is the {plug:word} plug on"

[inputs.plug]
type = "str"
one_of = ["kettle", "heater", "fan"]

[nodes.which]
kind = "lookup"
on = "inputs.plug"
into = "node"
table = [
  { eq = "kettle", value = 4 },
  { eq = "heater", value = 5 },
  { eq = "fan", value = 7 },
]
next = "read"

[nodes.read]
kind = "observe"
matter = { url = "ws://matter.local:5580/ws", node = "{{ state.node }}", read = "1/OnOff/OnOff" }
into = "plug"                # state.plug = { url, node, path, ok, value, result, refused, body, json }
timeout = 5
next = "answered"

[nodes.answered]
kind = "decide"
on = "plug.ok"
branches = [{ when = { eq = true }, then = "on-or-off" }, { else = "unreachable" }]

[nodes.on-or-off]
kind = "decide"
on = "plug.value"
branches = [{ when = { eq = true }, then = "on" }, { when = { eq = false }, then = "off" }]

[nodes.on]
kind = "done"
say = "The {{ inputs.plug }} plug is on."
output = { plug = "{{ inputs.plug }}", on = true }

[nodes.off]
kind = "done"
say = "The {{ inputs.plug }} plug is off."
output = { plug = "{{ inputs.plug }}", on = false }

[nodes.unreachable]
kind = "fail"
reason = "unreachable"
say = "The controller cannot reach the {{ inputs.plug }} plug: {{ state.plug.refused.details }}"
