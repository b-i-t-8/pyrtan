# Turn a smart plug on or off, through a Matter controller. A matter act
# sends a cluster's command (OnOff's On, Off or Toggle) to an endpoint of
# a node; `confirm` would make the run ask first, and a dry run says what
# it would send without sending it.

name = "plug-switch"
version = 1
namespace = "pyrtan"
description = "Turn a smart plug on or off, through a Matter controller."
tags = ["home", "matter"]
license = "MIT"
hosts = ["matter.local"]
start = "which"

[[triggers]]
pattern = "turn {state:word} the {plug:word} plug"
[[triggers]]
pattern = "turn the {plug:word} plug {state:word}"

[inputs.plug]
type = "str"
one_of = ["kettle", "heater", "fan"]

[inputs.state]
type = "str"
one_of = ["on", "off"]

[nodes.which]
kind = "lookup"
on = "inputs.plug"
into = "node"
table = [
  { eq = "kettle", value = 4 },
  { eq = "heater", value = 5 },
  { eq = "fan", value = 7 },
]
next = "switch"

[nodes.switch]
kind = "act"
matter = { url = "ws://matter.local:5580/ws", node = "{{ state.node }}", endpoint = 1, cluster = "OnOff", command = "{{ inputs.state | title }}" }
into = "sent"
timeout = 5
next = "sent"

[nodes.sent]
kind = "decide"
on = "sent.ok"
branches = [{ when = { eq = true }, then = "done" }, { else = "unreachable" }]

[nodes.done]
kind = "done"
say = "The {{ inputs.plug }} plug is {{ inputs.state }}."
output = { plug = "{{ inputs.plug }}", on = "{{ inputs.state }}" }

[nodes.unreachable]
kind = "fail"
reason = "unreachable"
say = "The controller cannot reach the {{ inputs.plug }} plug: {{ state.sent.refused.details }}"
