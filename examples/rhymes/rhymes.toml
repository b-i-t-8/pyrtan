# Words that rhyme, from Datamuse, most common first.

name = "rhymes"
version = 1
namespace = "pyrtan"
description = "Words that rhyme with a word, from Datamuse."
tags = ["language", "read-only"]
license = "MIT"
hosts = ["api.datamuse.com"]
start = "fetch"

[[triggers]]
pattern = "what rhymes with {word:word}"
[[triggers]]
pattern = "(rhymes|words that rhyme) (for|with) {word:word}"

[inputs.word]
type = "str"
pattern = "^[A-Za-z][A-Za-z'\\-]*$"
description = "One English word"

[nodes.fetch]
kind = "observe"
http = { method = "GET", url = "https://api.datamuse.com/words?rel_rhy={{ inputs.word | lower | url }}&max=10" }
into = "resp"
extract = [
  { into = "words", regex = "\"word\":\\s*\"([^\"]+)\"", all = true },
]
next = "status"

[nodes.status]
kind = "decide"
on = "resp.status"
branches = [
  { when = { eq = 200 }, then = "any" },
  { else = "unexpected" },
]

[nodes.any]
kind = "decide"
on = "words"
branches = [
  { when = { empty = true }, then = "none" },
  { else = "reply" },
]

[nodes.reply]
kind = "done"
say = "Rhymes with {{ inputs.word }}: {{ state.words | join }}."
output = { word = "{{ inputs.word }}", rhymes = "{{ state.words }}" }

[nodes.none]
kind = "fail"
reason = "no-rhymes"
say = "Datamuse knows nothing that rhymes with {{ inputs.word }}."

[nodes.unexpected]
kind = "fail"
reason = "unexpected-status"
say = "Datamuse answered {{ state.resp.status }}."
