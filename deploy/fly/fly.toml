# The seed hub at seed.pyrtan.com, the first entry in
# site/rendezvous/seeds.json: a federated hub that is always up, lists
# itself in the directory, and holds the examples that only read public
# APIs. Deploy from the repository root:
#
#   fly deploy . --config deploy/fly/fly.toml --dockerfile deploy/fly/Dockerfile
#
# First time, and the token, in README.md beside this file.

app = "pyrtan-seed"
primary_region = "iad"

[env]
  PYRTAN_ADVERTISE = "https://seed.pyrtan.com"
  PYRTAN_LISTED = "true"
  PYRTAN_REPORT_GAPS = "true"
  PYRTAN_STATE = "/data/federation.json"
  PYRTAN_STORE = "/data/store"
  PYRTAN_UNANSWERED = "/data/unanswered.jsonl"

# Only the trees that read public APIs: the others run a shell, read files
# or a serial line, or fetch any host, none of which a public box should do
# for strangers. PYRTAN_TOKEN is a secret (fly secrets set); /actor,
# /directory and signed federation requests stay open without it.
[processes]
  app = "hub --host 0.0.0.0 --port 8700 --name seed --trees /examples/weather --trees /examples/hacker-news --trees /examples/github --gaps /data/gaps.jsonl --egress public --cors https://pyrtan.com"

[[mounts]]
  source = "pyrtan_seed"
  destination = "/data"

[http_service]
  internal_port = 8700
  force_https = true
  # A seed answers follows and gossips the directory; it never sleeps.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
