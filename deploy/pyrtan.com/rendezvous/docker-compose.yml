# The rendezvous: the public hub at hub.pyrtan.com that anyone may follow
# to try federation, and that lists the hubs which asked to be found.
#
# One box with Docker, DNS for hub.pyrtan.com pointing at it, ports 80
# and 443 open. Caddy gets the certificate; the hub and one service with
# the example trees sit behind it on the compose network. Put the token
# in .env (PYRTAN_TOKEN=...) and `docker compose up -d`.
#
# The hub's own paths (/follow, /peers, /outbox, /unanswered, /gaps) need
# the token; /actor, /inbox, /directory, /health and the console are
# public, which is what a rendezvous is for. It follows nobody, so it
# routes to nobody but its own service.

name: rendezvous

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [hub]

  hub:
    image: ghcr.io/b-i-t-8/pyrtan:0.3.0   # or build: ../../.. from a checkout
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: [/tmp]
    environment:
      PYRTAN_TOKEN: ${PYRTAN_TOKEN:?set PYRTAN_TOKEN in .env}
      PYRTAN_PORT: "8700"
    command:
      - hub
      - --host
      - 0.0.0.0
      - --port
      - "8700"
      - --name
      - rendezvous
      - --federate
      - --advertise
      - https://hub.pyrtan.com
      - --state
      - /state/federation.json
      - --cors
      - https://pyrtan.com
      - --poll
      - "15"
    volumes:
      - state:/state

  examples:
    image: ghcr.io/b-i-t-8/pyrtan:0.3.0
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: [/tmp]
    environment:
      PYRTAN_TOKEN: ${PYRTAN_TOKEN}
      PYRTAN_EGRESS: public      # the example trees reach only public hosts
    command: ["serve", "/examples", "--host", "0.0.0.0", "--port", "8701", "--name", "examples", "--hub", "http://hub:8700", "--advertise", "http://examples:8701", "--gaps", "/state/gaps.jsonl", "--egress", "public"]
    volumes:
      - state:/state
    depends_on: [hub]

volumes:
  state:
  caddy-data:
  caddy-config:
