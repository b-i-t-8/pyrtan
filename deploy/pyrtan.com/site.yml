# The site repository's workflow (pyrtan-site/.github/workflows/site.yml).
#
# Publishes index.html, CNAME and the console (written by `pyrtan console
# --out` from a pinned release of b-i-t-8/pyrtan) to GitHub Pages at
# pyrtan.com. Bump PYRTAN_REF to ship a newer console.

name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYRTAN_REF: v0.4.0

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install pyrtan
        run: uv tool install --python 3.12 "git+https://github.com/b-i-t-8/pyrtan@${PYRTAN_REF}"
      - name: Assemble the site
        run: |
          mkdir -p site/console
          cp index.html CNAME site/
          pyrtan console --out site/console/index.html
          mkdir -p site/rendezvous
          cp rendezvous/seeds.json site/rendezvous/seeds.json
          touch site/.nojekyll

      # To serve the catalog from this same deployment instead of proxying
      # b-i-t-8.github.io/pyrtan-trees, uncomment this block (and give the
      # job `contents: read` on that repository if it is private).
      # - uses: actions/checkout@v4
      #   with:
      #     repository: b-i-t-8/pyrtan-trees
      #     path: trees-repo
      # - name: Build the catalog into /catalog
      #   run: |
      #     mkdir -p site/catalog
      #     pyrtan index trees-repo/trees --out site/catalog/index.json
      #     (cd trees-repo/trees && find . -name '*.toml' | cpio -pdm ../../site/catalog)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
