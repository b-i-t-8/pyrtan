# Pyrtan demo swarm for OpenMediaVault (or any Docker host).
#
# One hub, reachable from the LAN, and two services behind it that each
# hold part of the examples, so the demo shows routing between services
# rather than one process. A third service holds a trees/ folder you can
# edit on the NAS: drop a .toml in and it is live on the next request.
#
# Edit the two CHANGE-ME paths (the checkout, and a trees folder) to match
# your shared folder, then in OMV: Services > Compose > Files > Add (paste
# this) > Up. Steps in ../README.md.
#
# Open http://<nas-ip>:8700/ for the demo page.

name: pyrtan

x-pyrtan: &pyrtan
  # Built on the NAS from a checkout of the repository (no image is
  # published yet). The context is the repository root.
  build:
    context: /srv/dev-disk-by-uuid-CHANGE-ME/pyrtan
  image: pyrtan:local
  restart: unless-stopped
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  tmpfs: [/tmp]
  logging:
    driver: json-file
    options: { max-size: "5m", max-file: "3" }
  environment: &env
    # Uncomment to require a bearer token on every request but /health and
    # the console. Every container reads it, so the swarm shares it. Do
    # this before the hub is reachable from outside your LAN.
    # PYRTAN_TOKEN: "change-me-to-something-long"
    PYRTAN_EGRESS: any
    # Federation: once the hub is reachable from outside (a tunnel or a
    # port-forward with TLS), give it its public URL and it joins the
    # default network pyrtan.com publishes, follows a seed in it, and lists
    # itself in the directory. Needs the token, and PYRTAN_EGRESS: public
    # above: hubs that follow this one may ask it to run trees.
    # PYRTAN_JOIN may also hold invites to networks of your own
    # (NAME:SECRET@HUB, from `pyrtan network new`), space-separated.
    # PYRTAN_ADVERTISE: "https://hub.example.net"
    # PYRTAN_JOIN: "default"
    # PYRTAN_LISTED: "true"
    # PYRTAN_REPORT_GAPS: "true"        # opt in: the gaps your catalog trees meet (tree, node, value; never inputs) reach their authors via pyrtan.com
    # PYRTAN_WATCH: "true"              # run the trees' [[watches]]: a clock, a file, a topic or a serial line starts a run
    # PYRTAN_CHAT: "true"               # a lobby at /chat: people meet a random stranger here or on a hub this one follows, or a bot made of its trees
    PYRTAN_UNANSWERED: /state/unanswered.jsonl   # sentences nobody answered, kept across restarts (the hub's; services with a hub leave the record to it)
    PYRTAN_STATE: /state/federation.json
    PYRTAN_STORE: /state/store          # blobs: the hub's own and the ones it keeps for others
    PYRTAN_REPLICAS: "2"                # how many members or hubs should keep each of its blobs
    # PYRTAN_HANDOUT: /handout          # trees for the phones that joined with the token, not for this box (mount a directory at /handout)

services:
  hub:
    <<: *pyrtan
    # --cors lets the console at pyrtan.com talk to this hub from a browser.
    command: ["hub", "--host", "0.0.0.0", "--port", "8700", "--poll", "10", "--cors", "https://pyrtan.com"]
    environment:
      <<: *env
      PYRTAN_PORT: "8700"
    ports:
      - "8700:8700"
    volumes:
      - hub-state:/state
      # - /srv/dev-disk-by-uuid-CHANGE-ME/pyrtan/handout:/handout   # with PYRTAN_HANDOUT above: trees the phones run
    # Trees that read files, run programs or open serial lines reach this
    # container, not the NAS: mount what they may see (read-only where you
    # can) and pass the devices through; the tree's own paths/commands/
    # devices lists are the allow-lists. PYRTAN_EGRESS: public closes all
    # three. Browser trees need an image with Playwright (pyrtan[browser]).
    # volumes:
    #   - /var/log:/var/log:ro
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0

  news:
    <<: *pyrtan
    command: ["serve", "/examples/hacker-news", "/examples/github", "--host", "0.0.0.0", "--port", "8701", "--name", "news", "--hub", "http://hub:8700", "--advertise", "http://news:8701"]
    depends_on: [hub]

  weather:
    <<: *pyrtan
    command: ["serve", "/examples/weather", "/examples/site-status", "--host", "0.0.0.0", "--port", "8701", "--name", "weather", "--hub", "http://hub:8700", "--advertise", "http://weather:8701"]
    depends_on: [hub]

  # Your own trees. Edit files in this folder from a share; the service
  # reloads them without a restart. `pyrtan check` them first:
  #   docker compose -p pyrtan exec mine pyrtan check /trees
  # Gaps are kept in /trees/.gaps.jsonl (the one file the service writes),
  # so the list of branches to write survives a restart.
  mine:
    <<: *pyrtan
    command: ["serve", "/trees", "--host", "0.0.0.0", "--port", "8701", "--name", "mine", "--hub", "http://hub:8700", "--advertise", "http://mine:8701", "--gaps", "/trees/.gaps.jsonl"]
    volumes:
      - /srv/dev-disk-by-uuid-CHANGE-ME/pyrtan/trees:/trees
    depends_on: [hub]

volumes:
  hub-state:
