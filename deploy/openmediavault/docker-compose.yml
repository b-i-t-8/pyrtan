# Pyrtan on the NAS: the family hub, for OpenMediaVault (or any Docker host).
#
# A private hub for the family and nobody else: every request needs the
# token, the lobby (chat) is behind it too, and the hub is in a private
# network of its own (made once, below) rather than the public one, so it
# is in no public directory and on no list at pyrtan.com. Two services
# behind the hub hold part of the examples, and a third holds a trees/
# folder you can edit on the NAS: drop a .toml in and it is live on the
# next request.
#
# Edit the CHANGE-ME values (the token, the NAS's address, the checkout and
# the trees folder), then in OMV: Services > Compose > Files > Add (paste
# this) > Up. Steps in ../README.md.
#
# Open http://<nas-ip>:8700/ and enter the token.

name: pyrtan

x-pyrtan: &pyrtan
  # Built on the NAS from a checkout of the repository (no image is
  # published yet). The context is the repository root.
  build:
    context: /srv/dev-disk-by-uuid-CHANGE-ME/pyrtan
  image: pyrtan:local
  restart: unless-stopped
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  tmpfs: [/tmp]
  logging:
    driver: json-file
    options: { max-size: "5m", max-file: "3" }
  environment: &env
    # The family's way in, on every request but /health and the console
    # page itself. Every container reads it, so the swarm shares it; the
    # services present it when they register with the hub. Make one with
    # `openssl rand -hex 24`, and never commit the real one.
    PYRTAN_TOKEN: "CHANGE-ME-to-a-long-random-string"
    # Sign in with the account the family has at an OpenID Connect provider (Authentik, Keycloak, Authelia…),
    # on top of the token: register http://<nas-ip>:8700/auth/oidc/callback at the provider, then
    # PYRTAN_OIDC: "https://auth.example.org/application/o/pyrtan/"   # the issuer
    # PYRTAN_OIDC_CLIENT_ID: "pyrtan"
    # PYRTAN_OIDC_CLIENT_SECRET: "…"
    # PYRTAN_OIDC_REDIRECT: "http://CHANGE-ME-nas-ip:8700"            # this hub as a browser reaches it
    # PYRTAN_OIDC_GROUPS: "family=ask,chat,run;admins=operate"
    # PYRTAN_OIDC_AUTO: "true"                                        # single sign-on: no button, straight to the provider
    # Hubs that follow this one (the family's other hubs) may ask it to run
    # trees, so no tree may reach the LAN, files, programs or serial lines
    # on their behalf: the hub and the example services keep to public
    # addresses. The `mine` service below overrides this with any, so the
    # trees you put in trees/ can reach the house's devices.
    PYRTAN_EGRESS: public
    # PYRTAN_WATCH: "true"              # run the trees' [[watches]]: a clock, a file, a topic or a serial line starts a run
    PYRTAN_UNANSWERED: /state/unanswered.jsonl   # sentences nobody answered, kept across restarts (the hub's; services with a hub leave the record to it)
    PYRTAN_STATE: /state/federation.json         # the family network, who follows whom, the directory
    PYRTAN_STORE: /state/store          # blobs: the hub's own and the ones it keeps for others
    PYRTAN_REPLICAS: "2"                # how many family phones or hubs should keep each of its blobs
    # PYRTAN_HANDOUT: /handout          # trees for the phones that joined with the token, not for this box (mount a directory at /handout)
    #
    # Left out on purpose, since they are for public hubs: PYRTAN_LISTED and
    # PYRTAN_JOIN: default (the public directory and network), PYRTAN_CHAT_PUBLIC
    # and PYRTAN_CHAT_REACH (strangers from outside), PYRTAN_REPORT_GAPS (gap
    # reports that can travel to pyrtan.com), and PYRTAN_LAN (LAN beacons name
    # only public networks; the invite already carries this hub's address).

services:
  hub:
    <<: *pyrtan
    # No --cors: the family uses this hub's own console at http://<nas-ip>:8700/,
    # and no page elsewhere (pyrtan.com's console included) is let in.
    command: ["hub", "--host", "0.0.0.0", "--port", "8700", "--poll", "10"]
    environment:
      <<: *env
      PYRTAN_PORT: "8700"
      # The hub alone reads these.
      # The address the family's other hubs reach this one at: the NAS's LAN
      # address if they are all in this house, or its address on a private
      # overlay such as Tailscale (http://<nas-name>.<tailnet>.ts.net:8700) if
      # they are not. Never a public tunnel. Setting it makes the hub
      # federated, so it can make the family network:
      #   pyrtan network new family --at http://<nas-ip>:8700 --token <token>
      # prints the invite, family:SECRET@http://<nas-ip>:8700. Share it only
      # with the family; another family hub joins with it.
      PYRTAN_ADVERTISE: "http://CHANGE-ME-nas-ip:8700"
      # On a family hub other than this first one, the invite goes here instead
      # of the command above (it is a secret: keep that file to yourself).
      # PYRTAN_JOIN: "family:SECRET@http://<first-hub>:8700"
      # The lobby: the strangers here are family, behind the token; nobody from
      # outside, and no links to other lobbies. For family hubs in other
      # houses to share their lobbies with this one, this hub follows each of
      # them back (they follow it when they join):
      #   pyrtan follow http://<their hub>:8700 --network family --at http://<nas-ip>:8700 --token <token>
      PYRTAN_CHAT: "true"
      # Closed: follows only within its networks (the family's hubs), and
      # members (phones, browsers) only with the token. A stranger's phone or
      # hub on the LAN or the tailnet is refused, and so never handed the
      # hub's blobs.
      PYRTAN_CLOSED: "true"
    ports:
      - "8700:8700"
    # How the hub reaches `mine`, which runs on the NAS's own network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hub-state:/state
      # - /srv/dev-disk-by-uuid-CHANGE-ME/pyrtan/handout:/handout   # with PYRTAN_HANDOUT above: trees the phones run
    # Trees that read files, run programs or open serial lines reach this
    # container, not the NAS: mount what they may see (read-only where you
    # can) and pass the devices through; the tree's own paths/commands/
    # devices lists are the allow-lists. PYRTAN_EGRESS: public closes all
    # three. Browser trees need an image with Playwright (pyrtan[browser]).
    # volumes:
    #   - /var/log:/var/log:ro
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0

  news:
    <<: *pyrtan
    command: ["serve", "/examples/hacker-news", "/examples/github", "--host", "0.0.0.0", "--port", "8701", "--name", "news", "--hub", "http://hub:8700", "--advertise", "http://news:8701"]
    depends_on: [hub]

  weather:
    <<: *pyrtan
    command: ["serve", "/examples/weather", "/examples/site-status", "--host", "0.0.0.0", "--port", "8701", "--name", "weather", "--hub", "http://hub:8700", "--advertise", "http://weather:8701"]
    depends_on: [hub]

  # Your own trees. Edit files in this folder from a share; the service
  # reloads them without a restart. `pyrtan check` them first:
  #   docker compose -p pyrtan exec mine pyrtan check /trees
  # Gaps are kept in /trees/.gaps.jsonl (the one file the service writes),
  # so the list of branches to write survives a restart.
  #
  # This one reaches the LAN (PYRTAN_EGRESS: any): a tree here may talk to
  # the house's devices (Modbus, BACnet, SNMP, CoAP, a Matter controller,
  # anything on a private address) and look for them (discover), within the
  # hosts and networks it lists. Every hub in the family network may ask it
  # to run its trees, so put a tree here only if the family may use it.
  #
  # It runs on the NAS's own network (network_mode: host), not the compose
  # network, because the broadcast and multicast that discovery uses (mDNS,
  # SSDP, BACnet Who-Is) do not cross Docker's NAT. So it listens on the
  # NAS's port 8702 (8701 is the bare demo's, ../README.md), behind the
  # token like everything else; it reaches the hub at the port the hub
  # publishes, and the hub reaches it through the Docker host's gateway
  # (host.docker.internal, given to the hub below).
  mine:
    <<: *pyrtan
    network_mode: host
    command: ["serve", "/trees", "--host", "0.0.0.0", "--port", "8702", "--name", "mine", "--hub", "http://127.0.0.1:8700", "--advertise", "http://host.docker.internal:8702", "--gaps", "/trees/.gaps.jsonl"]
    environment:
      <<: *env
      PYRTAN_EGRESS: any
      PYRTAN_PORT: "8702"        # what the health check asks
      # Run the [[watches]] of the trees in trees/ (a device-offline check
      # every minute, say), and keep what memory nodes remember in a file
      # there, so a restart does not forget an outage.
      PYRTAN_WATCH: "true"
      PYRTAN_MEMORY: /trees/.memory.json
      # Each watch's timeline (a month of what its runs came to), which the
      # console's Devices tab draws as uptime; kept across restarts.
      PYRTAN_WATCH_HISTORY: /trees/.watch-history.json
      # What trees read as {{ env.NAME }}: the ntfy topic your phone
      # subscribes to, for device-offline's alerts. A secret: keep it here.
      # PYRTAN_ENV_NTFY_TOPIC: "CHANGE-ME-to-a-long-random-topic"
    volumes:
      - /srv/dev-disk-by-uuid-CHANGE-ME/pyrtan/trees:/trees
    depends_on: [hub]

volumes:
  hub-state:
